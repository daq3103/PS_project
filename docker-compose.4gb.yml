# Apply with: docker compose -f docker-compose.yml -f docker-compose.4gb.yml up -d
# Runtime budget: 2688 MiB total container limits; leave room for Linux and bursts.
services:
  nginx:
    mem_limit: 64m
  nextjs:
    mem_limit: 640m
    environment:
      NODE_OPTIONS: --max-old-space-size=384
  fastapi-api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-proxy-headers --no-access-log
    mem_limit: 512m
    environment:
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "2"
  fastapi-worker:
    mem_limit: 256m
    environment:
      DB_POOL_SIZE: "3"
      DB_MAX_OVERFLOW: "1"
      WORKER_MAX_JOBS: "3"
  postgres:
    mem_limit: 896m
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=2MB
      -c maintenance_work_mem=64MB
      -c max_connections=60
      -c wal_keep_size=256MB
      -c timezone=Asia/Ho_Chi_Minh
  redis-cache:
    mem_limit: 160m
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --save "" --appendonly no --requirepass ${REDIS_CACHE_PASSWORD}
  redis-queue:
    mem_limit: 160m
    command: redis-server --maxmemory 64mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec --requirepass ${REDIS_QUEUE_PASSWORD}

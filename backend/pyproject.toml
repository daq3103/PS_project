[project]
name = "petshop-backend"
version = "0.1.0"
description = "Pet shop e-commerce API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "google-auth[requests]>=2.38.0,<3",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "redis>=5.2.0",
  "arq>=0.26.1",
  "httpx>=0.28.0",
  "argon2-cffi>=23.1.0",
  "PyJWT>=2.10.0",
  "cryptography>=44.0.0",
  "python-multipart>=0.0.17",
  "email-validator>=2.2.0",
  "pyotp>=2.9.0",
  "python-slugify>=8.0.0",
  "Pillow>=11.0.0",
  "psutil>=6.1.0,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "openapi-typescript-codegen>=0.0.0; python_version<'0'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.modules.community" = ["locations.json"]

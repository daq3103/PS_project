worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    # Keep status/timing without query strings, signed download tickets or referrers.
    log_format pethome_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log pethome_safe;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Docker Compose embedded DNS: re-resolve service names on every request
    # so upstream container IPs are not cached across recreates.
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;
        server_name _;
        client_max_body_size 10m;

        location /api/proxy/ {
            set $fe_host nextjs:3000;
            proxy_pass http://$fe_host;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /api/ {
            set $api_host fastapi-api:8000;
            proxy_pass http://$api_host;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /docs {
            set $api_host fastapi-api:8000;
            proxy_pass http://$api_host;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /openapi.json {
            set $api_host fastapi-api:8000;
            proxy_pass http://$api_host;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location = /readyz {
            set $api_host fastapi-api:8000;
            proxy_pass http://$api_host;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /healthz {
            set $api_host fastapi-api:8000;
            proxy_pass http://$api_host;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            set $fe_host nextjs:3000;
            proxy_pass http://$fe_host;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
